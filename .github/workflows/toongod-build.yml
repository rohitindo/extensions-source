name: Build ToonGod APK

on:
  push:
    branches:
      - main
    paths:
      - "src/en/toongod/**"
      - "lib-multisrc/madara/**"
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/toongod-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toongod:
    name: Build ToonGod
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Build ToonGod release APK
        run: ./gradlew :src:en:toongod:assembleRelease

      - name: Upload ToonGod APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toongod-apk
          path: src/en/toongod/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
